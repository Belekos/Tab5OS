name: Validate Tab5OS firmware
on:
  push:
    branches: [validation/languages-dos-themes-20261109]
permissions:
  contents: read
concurrency:
  group: tab5os-firmware-validation-20261109
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare pinned toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tab5os-build"
          mkdir -p "$BUILD/qa"
          git rev-parse HEAD > "$BUILD/qa/validated-commit.txt"
          curl --fail --location --retry 3 https://downloads.arduino.cc/arduino-cli/arduino-cli_1.5.1_Linux_64bit.tar.gz --output "$BUILD/arduino-cli.tar.gz"
          printf '%s  %s\n' 28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b "$BUILD/arduino-cli.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$BUILD/arduino-cli.tar.gz" -C "$BUILD" arduino-cli
          "$BUILD/arduino-cli" version
          python3 firmware/build/build_linux/prepare_linux.py --environment "$BUILD" 2>&1 | tee "$BUILD/qa/dependencies.log"
          python3 firmware/build/build_linux/verify_downloads.py --environment "$BUILD"
      - name: Validate all language packs and the production loader
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tab5os-build"
          python3 firmware/Tab5OS_Arduino_v0.8.53/tools/tests/languages/run_tests.py --arduinojson "$BUILD/sketchbook/libraries/ArduinoJson" --output "$BUILD/qa/language-tests.json" 2>&1 | tee "$BUILD/qa/language-tests.log"
      - name: Validate physical keyboard and scoped directory access
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tab5os-build"
          python3 firmware/Tab5OS_Arduino_v0.8.53/tools/tests/abi7/run_tests.py --output "$BUILD/qa/abi7-tests.json" 2>&1 | tee "$BUILD/qa/abi7-tests.log"
      - name: Validate mouse capture against LVGL and PCM buffer ownership
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tab5os-build"
          SKETCH="$GITHUB_WORKSPACE/firmware/Tab5OS_Arduino_v0.8.53"
          python3 "$SKETCH/tools/tests/abi7/run_mouse_capture_lvgl.py" --lvgl "$BUILD/sketchbook/libraries/lvgl" --output "$BUILD/qa/abi7-lvgl-mouse-tests.json" 2>&1 | tee "$BUILD/qa/abi7-lvgl-mouse-tests.log"
          python3 "$SKETCH/tools/tests/audio-driver/run_tests.py" --output "$BUILD/qa/audio-driver-tests.json" 2>&1 | tee "$BUILD/qa/audio-driver-tests.log"
      - name: Validate the drawing core and relief lighting
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tab5os-build"
          python3 firmware/Tab5OS_Arduino_v0.8.53/tools/native-apps/image-editor/run_tests.py --output "$BUILD/qa/image-core-report.json" 2>&1 | tee "$BUILD/qa/image-core-tests.log"
      - name: Build and verify the Doom application
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tab5os-build"
          TOOLCHAIN="$BUILD/data/packages/m5stack/tools/esp-rv32/2601/bin"
          mkdir -p "$BUILD/native"
          python3 firmware/Tab5OS_Arduino_v0.8.53/tools/native-apps/doom/tests/run_tests.py --output "$BUILD/qa/doom-input-report.json" 2>&1 | tee "$BUILD/qa/doom-input-tests.log"
          python3 firmware/Tab5OS_Arduino_v0.8.53/tools/native-apps/doom/build.py --toolchain "$TOOLCHAIN" --output "$BUILD/native/Doom.app.elf" 2>&1 | tee "$BUILD/qa/doom-build.log"
          python3 firmware/Tab5OS_Arduino_v0.8.53/tools/native-apps/doom/tests/verify_build.py "$BUILD/native/Doom.app.elf" --output "$BUILD/qa/doom-build-report.json"
          "$TOOLCHAIN/riscv32-esp-elf-readelf" -h -l -r -Ws "$BUILD/native/Doom.app.elf" > "$BUILD/qa/doom-elf.txt"
          sha256sum "$BUILD/native/Doom.app.elf" > "$BUILD/qa/doom-sha256.txt"
      - name: Exercise Doom startup and gameplay
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tab5os-build"
          TESTS=firmware/Tab5OS_Arduino_v0.8.53/tools/native-apps/doom/tests
          mkdir -p "$BUILD/fixtures"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/x213212/gba-p4/03aeeb07d026fe3138e8cf906e42fb14d00e48b7/prboom-go/components/prboom/data/doom1.wad --output "$BUILD/fixtures/doom1.wad"
          printf '%s  %s\n' 1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771 "$BUILD/fixtures/doom1.wad" | sha256sum --check
          python3 -m venv "$BUILD/emulator-venv"
          "$BUILD/emulator-venv/bin/python" -m pip install --disable-pip-version-check unicorn==2.1.4
          "$BUILD/emulator-venv/bin/python" "$TESTS/emulate_startup.py" --elf "$BUILD/native/Doom.app.elf" --wad "$BUILD/fixtures/doom1.wad" --output "$BUILD/qa/doom-startup-report.json" --frames 120 --instruction-limit 1000000000 --timeout-seconds 180 2>&1 | tee "$BUILD/qa/doom-startup.log"
          "$BUILD/emulator-venv/bin/python" "$TESTS/emulate_startup.py" --elf "$BUILD/native/Doom.app.elf" --wad "$BUILD/fixtures/doom1.wad" --output "$BUILD/qa/doom-play-report.json" --play --frames 240 --instruction-limit 3000000000 --timeout-seconds 180 2>&1 | tee "$BUILD/qa/doom-play.log"
          python3 "$TESTS/run_startup_host.py" --wad "$BUILD/fixtures/doom1.wad" --output "$BUILD/qa/doom-startup-host.json" 2>&1 | tee "$BUILD/qa/doom-startup-host.log"
      - name: Build and exercise the DOS application
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tab5os-build"
          SKETCH="$GITHUB_WORKSPACE/firmware/Tab5OS_Arduino_v0.8.53"
          DOS="$SKETCH/tools/native-apps/dos"
          TOOLCHAIN="$BUILD/data/packages/m5stack/tools/esp-rv32/2601/bin"
          mkdir -p "$BUILD/native"
          python3 "$DOS/tests/build_host.py" --cc gcc -o "$BUILD/native/tab5-dos-host" 2>&1 | tee "$BUILD/qa/dos-host-build.log"
          python3 "$DOS/tests/run_folder_tests.py" --output "$BUILD/qa/dos-folder-tests.json" 2>&1 | tee "$BUILD/qa/dos-folder-tests.log"
          python3 "$DOS/tests/run_overlay_tests.py" --output "$BUILD/qa/dos-overlay" 2>&1 | tee "$BUILD/qa/dos-overlay-tests.log"
          cp "$BUILD/qa/dos-overlay/dos-overlay-tests.json" "$BUILD/qa/dos-overlay-tests.json"
          python3 "$DOS/tests/run_runtime_tests.py" --output "$BUILD/qa/dos-runtime-tests.json" 2>&1 | tee "$BUILD/qa/dos-runtime-tests.log"
          python3 "$DOS/tests/run_video_tests.py" --output "$BUILD/qa/dos-video-tests.json" 2>&1 | tee "$BUILD/qa/dos-video-tests.log"
          python3 "$DOS/tests/run_io_tests.py" --output "$BUILD/qa/dos-io-tests.json" 2>&1 | tee "$BUILD/qa/dos-io-tests.log"
          python3 "$DOS/tests/run_audio_tests.py" --output "$BUILD/qa/dos-audio-tests.json" 2>&1 | tee "$BUILD/qa/dos-audio-tests.log"
          python3 "$DOS/tests/run_mouse_tests.py" --output "$BUILD/qa/mouse-tests.json" 2>&1 | tee "$BUILD/qa/mouse-tests.log"
          python3 "$DOS/tests/run_startup_tests.py" --output "$BUILD/qa/dos-startup-tests.json" 2>&1 | tee "$BUILD/qa/dos-startup-tests.log"
          "$BUILD/emulator-venv/bin/python" "$DOS/tests/measure_runtime_rv32.py" --toolchain "$TOOLCHAIN" --output "$BUILD/qa/dos-runtime-rv32.json" 2>&1 | tee "$BUILD/qa/dos-runtime-rv32.log"
          python3 "$DOS/tests/test_boot.py" --host "$BUILD/native/tab5-dos-host" --image "$SKETCH/sdcard/DOS/FREEDOS.IMG" --output "$BUILD/qa/dos-boot-report.json" 2>&1 | tee "$BUILD/qa/dos-boot-tests.log"
          python3 "$DOS/build.py" --toolchain "$TOOLCHAIN" -o "$BUILD/native/DOS.app.elf" 2>&1 | tee "$BUILD/qa/dos-build.log"
          python3 "$SKETCH/tools/tests/native-elf/verify.py" --elf "$BUILD/native/DOS.app.elf" --expected-import tab5_app_api_v7 --extra-elf "$BUILD/native/Doom.app.elf" --catalogue "$SKETCH/sdcard/Applications" --source-root "$DOS" --source-root "$SKETCH/tools/native-apps/common" --output "$BUILD/qa/native-admission-report.json" 2>&1 | tee "$BUILD/qa/native-admission.log"
          "$TOOLCHAIN/riscv32-esp-elf-readelf" -h -l -r -Ws "$BUILD/native/DOS.app.elf" > "$BUILD/qa/dos-elf.txt"
          sha256sum "$BUILD/native/DOS.app.elf" > "$BUILD/qa/dos-sha256.txt"
      - name: Execute the exact DOS ELF through the ABI7 frontend
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/tab5os-build"
          SKETCH="$GITHUB_WORKSPACE/firmware/Tab5OS_Arduino_v0.8.53"
          "$BUILD/emulator-venv/bin/python" "$SKETCH/tools/native-apps/dos/tests/emulate_app.py" --elf "$BUILD/native/DOS.app.elf" --image "$SKETCH/sdcard/DOS/FREEDOS.IMG" --output "$BUILD/qa/dos-app-report.json" --instruction-limit 15000000000 --timeout-seconds 600 2>&1 | tee "$BUILD/qa/dos-app-tests.log"
      - name: Compile ESP32-P4 firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/build/build_linux/compile_linux.py --release-root "$GITHUB_WORKSPACE/firmware" --environment "$RUNNER_TEMP/tab5os-build" --sketch-name Tab5OS_Arduino_v0.8.53 --jobs 4
      - name: Verify the firmware image and linked adaptations
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/build/build_linux/verify_linux.py --environment "$RUNNER_TEMP/tab5os-build"
          git diff --exit-code -- firmware
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tab5os-validation-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/tab5os-build/qa/*.json
            ${{ runner.temp }}/tab5os-build/qa/*.log
            ${{ runner.temp }}/tab5os-build/qa/*.d
            ${{ runner.temp }}/tab5os-build/qa/*.txt
            ${{ runner.temp }}/tab5os-build/qa/firmware/*-patch.json
            ${{ runner.temp }}/tab5os-build/qa/firmware/dsi-cache-safe/report.json
            ${{ runner.temp }}/tab5os-build/build/*.bin
            ${{ runner.temp }}/tab5os-build/build/*.elf
            ${{ runner.temp }}/tab5os-build/build/*.map
            ${{ runner.temp }}/tab5os-build/build/partitions.csv
            ${{ runner.temp }}/tab5os-build/build/sdkconfig
            ${{ runner.temp }}/tab5os-build/native/*.elf
